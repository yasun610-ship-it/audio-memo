<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>とけいであそぼう</title>
  <style>
    :root {
      --pink: #ff7eb3;
      --pink-deep: #ff5a9e;
      --lavender: #c9b6ff;
      --cream: #fff6f0;
      --white: #ffffff;
      --text: #5b3a55;
      --text-soft: #8a5a7a;
      --hour: #e85a9b;
      --minute: #7b6bc9;
      --shadow: 0 10px 24px rgba(255, 105, 165, 0.22);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: linear-gradient(180deg, #ffe6f3 0%, #f3e8ff 48%, #fff3e8 100%);
      color: var(--text);
      font-family: "Hiragino Maru Gothic ProN", "Hiragino Maru Gothic Pro", "Yu Gothic", "YuGothic", sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      min-height: 100dvh;
      overflow-x: hidden;
    }

    button {
      font-family: inherit;
      border: none;
      cursor: pointer;
      color: inherit;
    }

    #app {
      min-height: 100dvh;
      padding: calc(12px + var(--safe-top)) 16px calc(16px + var(--safe-bottom));
      max-width: 560px;
      margin: 0 auto;
    }

    .screen { display: none; }
    .screen.active { display: flex; flex-direction: column; gap: 16px; }

    .deco {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .deco span {
      position: absolute;
      border-radius: 50%;
      opacity: 0.35;
    }
    .deco .d1 { width: 140px; height: 140px; background: #ffc2e0; top: -30px; left: -20px; }
    .deco .d2 { width: 180px; height: 180px; background: #d9c8ff; top: 20%; right: -50px; }
    .deco .d3 { width: 120px; height: 120px; background: #ffe0b8; bottom: 8%; left: -30px; }
    .deco .heart {
      width: 18px; height: 18px; background: #ff9ec8; opacity: 0.45;
      top: 12%; left: 18%; border-radius: 18px 18px 4px 18px;
      transform: rotate(-20deg);
    }

    .screen > * { position: relative; z-index: 1; }

    .title {
      text-align: center;
      font-size: clamp(1.8rem, 7vw, 2.4rem);
      letter-spacing: 0.06em;
      color: #d94a8c;
      text-shadow: 0 3px 0 #fff;
      margin-top: 8px;
    }

    .bunny-wrap { display: flex; justify-content: center; }
    .speech {
      background: var(--white);
      border-radius: 24px;
      padding: 14px 18px;
      text-align: center;
      font-size: 1.15rem;
      line-height: 1.5;
      box-shadow: var(--shadow);
    }

    .levels {
      display: grid;
      grid-template-columns: 1fr 1fr 1.3fr;
      gap: 8px;
    }
    .level-btn {
      background: rgba(255,255,255,0.7);
      border-radius: 18px;
      padding: 12px 6px;
      font-size: 0.95rem;
      font-weight: 700;
      min-height: 56px;
      box-shadow: 0 4px 0 rgba(255, 170, 210, 0.5);
    }
    .level-btn.active {
      background: linear-gradient(180deg, #ff9ec8, #ff7eb3);
      color: #fff;
      box-shadow: 0 4px 0 #e45a98;
    }

    .mode-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 72px;
      border-radius: 28px;
      font-size: 1.35rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.04em;
    }
    .mode-game {
      background: linear-gradient(180deg, #ff9ec8, #ff5fa2);
      box-shadow: 0 6px 0 #e14b8c;
    }
    .mode-quiz {
      background: linear-gradient(180deg, #cbb6ff, #9b7dff);
      box-shadow: 0 6px 0 #7d62d6;
    }
    .mode-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 transparent; }
    .mode-daily {
      background: linear-gradient(180deg, #ffd36b, #ffb347);
      box-shadow: 0 6px 0 #e09a2f;
      color: #7a3d12;
    }
    .home-label {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text-soft);
      text-align: center;
      margin-top: 4px;
    }

    .play-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .back-btn {
      flex: 0 0 auto;
      background: #fff;
      border-radius: 999px;
      min-width: 72px;
      min-height: 48px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-soft);
      box-shadow: var(--shadow);
    }
    .prompt {
      flex: 1;
      background: #fff;
      border-radius: 22px;
      padding: 12px 14px;
      font-size: clamp(1.05rem, 4.2vw, 1.35rem);
      font-weight: 800;
      text-align: center;
      line-height: 1.4;
      box-shadow: var(--shadow);
      color: #c43d86;
    }

    .clock-wrap {
      display: flex;
      justify-content: center;
      touch-action: none;
    }
    #clock {
      width: min(92vw, 420px);
      height: auto;
      filter: drop-shadow(0 12px 18px rgba(232, 90, 155, 0.18));
      touch-action: none;
    }
    #clock.locked .hand-hit,
    #clock.locked #hour-arm,
    #clock.locked #minute-arm { pointer-events: none; }
    #clock:not(.locked) { cursor: grab; }
    #clock:not(.locked):active { cursor: grabbing; }

    .quiz-panel { display: none; gap: 10px; }
    .quiz-panel.show { display: flex; flex-direction: column; }
    .quiz-label {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text-soft);
      padding-left: 4px;
    }
    .hour-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .min-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
      gap: 8px;
    }
    .min-grid.many {
      grid-template-columns: repeat(4, 1fr);
    }
    .min-grid.many .pick {
      min-height: 48px;
      font-size: 0.95rem;
    }
    .pick {
      background: #fff;
      border-radius: 16px;
      min-height: 56px;
      font-size: 1.2rem;
      font-weight: 800;
      box-shadow: 0 4px 0 rgba(201, 182, 255, 0.45);
    }
    .pick.selected {
      background: linear-gradient(180deg, #ffb3d4, #ff7eb3);
      color: #fff;
      box-shadow: 0 4px 0 #e45a98;
    }

    .check-btn {
      width: 100%;
      min-height: 64px;
      border-radius: 28px;
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(180deg, #8ee0c8, #4ec9a8);
      box-shadow: 0 6px 0 #2eae8c;
    }
    .check-btn:disabled {
      opacity: 0.45;
      box-shadow: none;
    }
    .check-btn:not(:disabled):active { transform: translateY(3px); }

    .progress {
      display: none;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 800;
      color: #c43d86;
    }
    .progress.show { display: block; }
    .hint-row {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }
    .hint-btn {
      flex: 0 0 auto;
      min-width: 88px;
      min-height: 52px;
      border-radius: 18px;
      background: #fff;
      font-size: 1.05rem;
      font-weight: 800;
      color: #c43d86;
      box-shadow: 0 4px 0 rgba(255, 170, 210, 0.5);
    }
    .hint-btn:disabled {
      opacity: 0.4;
      box-shadow: none;
    }
    .hint {
      flex: 1;
      text-align: center;
      min-height: 1.4em;
      font-size: 1.05rem;
      font-weight: 700;
      color: #d94a8c;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #screen-play.compact #clock {
      width: min(78vw, 320px);
    }
    .clock-wrap.shake { animation: shake 0.45s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(255, 230, 245, 0.88);
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .overlay.show { display: flex; }
    .celebrate {
      background: #fff;
      border-radius: 32px;
      padding: 24px 20px 20px;
      width: min(92vw, 380px);
      text-align: center;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }
    .praise {
      font-size: 1.8rem;
      font-weight: 800;
      color: #e45a98;
      margin: 8px 0 16px;
    }
    .next-btn {
      width: 100%;
      min-height: 60px;
      border-radius: 24px;
      font-size: 1.3rem;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(180deg, #ff9ec8, #ff5fa2);
      box-shadow: 0 6px 0 #e14b8c;
    }
    .sparkle {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #ffd36b;
      border-radius: 50%;
      animation: twinkle 1.2s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.6); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .stamp {
      width: 150px;
      height: 150px;
      margin: 0 auto;
      animation: pop 0.55s cubic-bezier(0.2, 1.4, 0.4, 1);
    }
    @keyframes pop {
      0% { transform: scale(0.2) rotate(-12deg); opacity: 0; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="deco" aria-hidden="true">
    <span class="d1"></span>
    <span class="d2"></span>
    <span class="d3"></span>
    <span class="heart"></span>
  </div>

  <div id="app">
    <section id="screen-home" class="screen active">
      <h1 class="title">とけいであそぼう</h1>
      <div class="bunny-wrap" id="home-bunny"></div>
      <p class="speech">いっしょに とけいの はりで あそぼう！</p>
      <button class="mode-btn mode-daily" id="btn-daily">きょうの 10もん</button>
      <p class="home-label">じゆうに れんしゅう</p>
      <div class="levels" role="tablist" aria-label="むずかしさ">
        <button class="level-btn active" data-level="easy">かんたん</button>
        <button class="level-btn" data-level="medium">ふつう</button>
        <button class="level-btn" data-level="hard">ちょっと<br>むずかしい</button>
      </div>
      <button class="mode-btn mode-game" id="btn-game">はりを うごかそう</button>
      <button class="mode-btn mode-quiz" id="btn-quiz">なんじ かな？</button>
    </section>

    <section id="screen-play" class="screen">
      <div class="play-top">
        <button class="back-btn" id="btn-home">ホーム</button>
        <div class="prompt" id="prompt"></div>
      </div>
      <p class="progress" id="progress">1 / 10</p>
      <div class="clock-wrap" id="clock-wrap">
        <svg id="clock" viewBox="0 0 400 400" role="img" aria-label="アナログ時計">
          <defs>
            <radialGradient id="faceGrad" cx="50%" cy="38%" r="70%">
              <stop offset="0%" stop-color="#fff"/>
              <stop offset="100%" stop-color="#ffe9f4"/>
            </radialGradient>
          </defs>
          <circle cx="200" cy="200" r="196" fill="#ffb3d4"/>
          <circle cx="200" cy="200" r="184" fill="url(#faceGrad)" stroke="#fff" stroke-width="6"/>
          <g id="ticks" pointer-events="none"></g>
          <g id="numbers" pointer-events="none"></g>
          <g id="hour-arm">
            <line class="hand-hit" x1="200" y1="200" x2="200" y2="112" stroke="transparent" stroke-width="48" stroke-linecap="round"/>
            <line x1="200" y1="218" x2="200" y2="112" stroke="#e85a9b" stroke-width="16" stroke-linecap="round"/>
            <circle cx="200" cy="112" r="16" fill="#e85a9b" stroke="#fff" stroke-width="4"/>
          </g>
          <g id="minute-arm">
            <line class="hand-hit" x1="200" y1="200" x2="200" y2="50" stroke="transparent" stroke-width="40" stroke-linecap="round"/>
            <line x1="200" y1="222" x2="200" y2="50" stroke="#7b6bc9" stroke-width="10" stroke-linecap="round"/>
            <circle cx="200" cy="50" r="14" fill="#7b6bc9" stroke="#fff" stroke-width="4"/>
          </g>
          <circle cx="200" cy="200" r="12" fill="#ff7eb3" stroke="#fff" stroke-width="4" pointer-events="none"/>
        </svg>
      </div>
      <div class="quiz-panel" id="quiz-panel">
        <div class="quiz-label">なんじ？</div>
        <div class="hour-grid" id="hour-grid"></div>
        <div class="quiz-label" id="min-label">なんふん？</div>
        <div class="min-grid" id="min-grid"></div>
      </div>
      <div class="hint-row">
        <button class="hint-btn" id="hint-btn" type="button">ヒント</button>
        <p class="hint" id="hint"></p>
      </div>
      <button class="check-btn" id="check-btn">できた！</button>
    </section>
  </div>

  <div class="overlay" id="overlay">
    <div class="celebrate">
      <div id="sparkles"></div>
      <svg class="stamp" viewBox="0 0 160 160" aria-hidden="true">
        <circle cx="80" cy="80" r="62" fill="none" stroke="#ff5a7a" stroke-width="8"/>
        <circle cx="80" cy="80" r="50" fill="none" stroke="#ff8aa8" stroke-width="3"/>
        <text x="80" y="78" text-anchor="middle" font-size="28" font-weight="800" fill="#ff5a7a" font-family="inherit">はなまる</text>
        <text x="80" y="108" text-anchor="middle" font-size="22" font-weight="800" fill="#ff7eb3" font-family="inherit">★</text>
      </svg>
      <div id="win-bunny"></div>
      <p class="praise" id="praise"></p>
      <button class="next-btn" id="next-btn">つぎへ</button>
    </div>
  </div>

  <script>
    const FIVE_MINUTES = [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55];

    const LEVELS = {
      easy: { minutes: [0] },
      medium: { minutes: [0, 30] },
      hard: { minutes: FIVE_MINUTES }
    };

    const PRAISE = ["すごい！", "できたね！", "かしこいね！", "やったね！", "えらいね！", "パーフェクト！"];

    const MIN_LABELS = {
      0: "ちょうど",
      5: "5ふん",
      10: "10ふん",
      15: "15ふん",
      20: "20ふん",
      25: "25ふん",
      30: "はん",
      35: "35ふん",
      40: "40ふん",
      45: "45ふん",
      50: "50ふん",
      55: "55ふん"
    };

    const state = {
      practiceLevel: "easy",
      level: "easy",
      mode: "game",
      session: "free",
      dailyPlan: [],
      dailyIndex: 0,
      overlayKind: "celebrate",
      hintStage: 0,
      hour: 3,
      minute: 0,
      targetHour: 0,
      targetMinute: 0,
      dragging: null,
      quizHour: null,
      quizMinute: null
    };

    const els = {
      home: document.getElementById("screen-home"),
      play: document.getElementById("screen-play"),
      clock: document.getElementById("clock"),
      clockWrap: document.getElementById("clock-wrap"),
      hourArm: document.getElementById("hour-arm"),
      minuteArm: document.getElementById("minute-arm"),
      prompt: document.getElementById("prompt"),
      quizPanel: document.getElementById("quiz-panel"),
      hourGrid: document.getElementById("hour-grid"),
      minGrid: document.getElementById("min-grid"),
      minLabel: document.getElementById("min-label"),
      checkBtn: document.getElementById("check-btn"),
      hint: document.getElementById("hint"),
      hintBtn: document.getElementById("hint-btn"),
      progress: document.getElementById("progress"),
      overlay: document.getElementById("overlay"),
      praise: document.getElementById("praise"),
      sparkles: document.getElementById("sparkles"),
      nextBtn: document.getElementById("next-btn")
    };

    function bunnySvg(size) {
      return `
        <svg width="${size}" height="${size * 0.95}" viewBox="0 0 160 150" aria-hidden="true">
          <ellipse cx="58" cy="38" rx="16" ry="36" fill="#fff" stroke="#f4b6d2" stroke-width="3"/>
          <ellipse cx="102" cy="38" rx="16" ry="36" fill="#fff" stroke="#f4b6d2" stroke-width="3"/>
          <ellipse cx="58" cy="42" rx="8" ry="24" fill="#ffc5dc"/>
          <ellipse cx="102" cy="42" rx="8" ry="24" fill="#ffc5dc"/>
          <circle cx="80" cy="92" r="46" fill="#fff" stroke="#f4b6d2" stroke-width="3"/>
          <circle cx="64" cy="88" r="6" fill="#5b3a55"/>
          <circle cx="96" cy="88" r="6" fill="#5b3a55"/>
          <ellipse cx="80" cy="104" rx="7" ry="5" fill="#ff9ec8"/>
          <path d="M72 112 Q80 118 88 112" fill="none" stroke="#e85a9b" stroke-width="3" stroke-linecap="round"/>
          <circle cx="52" cy="100" r="8" fill="#ffd0e4"/>
          <circle cx="108" cy="100" r="8" fill="#ffd0e4"/>
        </svg>`;
    }

    function displayHour(h) {
      return (h % 12) || 12;
    }

    function formatTime(hour, minute) {
      const h = displayHour(hour);
      if (minute === 0) return h + "じ ちょうど";
      if (minute === 30) return h + "じ はん";
      return h + "じ " + MIN_LABELS[minute];
    }

    function formatTimeSpeech(hour, minute) {
      const h = displayHour(hour);
      if (minute === 0) return h + "時ですよ。";
      if (minute === 30) return h + "時半ですよ。";
      if (minute === 15) return h + "時15分ですよ。";
      if (minute === 45) return h + "時45分ですよ。";
      return h + "時" + minute + "分ですよ。";
    }

    let jaVoice = null;
    let speakSeq = 0;

    function voiceKey(voice) {
      return ((voice.name || "") + " " + (voice.voiceURI || "")).toLowerCase();
    }

    function scoreVoice(voice) {
      const name = voiceKey(voice);
      let score = 0;
      if (/online|neural|natural/.test(name)) score -= 100;
      if (/haruka|kyoko|ayumi|sakura|sayaka/.test(name)) score += 40;
      if (/nanami/.test(name) && !/online|neural|natural/.test(name)) score += 30;
      if (/female|woman|girl/.test(name)) score += 10;
      if ((voice.lang || "").toLowerCase() === "ja-jp") score += 8;
      if (/ichiro|otoya|hiroshi/.test(name)) score -= 20;
      return score;
    }

    function loadVoices() {
      if (!window.speechSynthesis) return;
      const ja = speechSynthesis.getVoices().filter(function (v) {
        return (v.lang || "").toLowerCase().indexOf("ja") === 0;
      });
      ja.sort(function (a, b) { return scoreVoice(b) - scoreVoice(a); });
      jaVoice = ja[0] || null;
    }

    function unlockSpeech() {
      try {
        if (speechSynthesis.paused) speechSynthesis.resume();
      } catch (err) {}
    }

    function speakPhrases(phrases) {
      if (!window.speechSynthesis) return;
      const seq = ++speakSeq;
      speechSynthesis.cancel();
      unlockSpeech();
      duckBgm(true);
      let i = 0;

      function finish() {
        if (seq === speakSeq) duckBgm(false);
      }

      function next() {
        if (seq !== speakSeq) return;
        if (i >= phrases.length) {
          finish();
          return;
        }
        unlockSpeech();
        const utter = new SpeechSynthesisUtterance(phrases[i++]);
        utter.lang = "ja-JP";
        utter.rate = 0.92;
        utter.pitch = 1.12;
        if (jaVoice && scoreVoice(jaVoice) >= 0) utter.voice = jaVoice;
        utter.onend = function () {
          if (seq !== speakSeq) return;
          setTimeout(function () {
            if (seq !== speakSeq) return;
            next();
          }, 180);
        };
        utter.onerror = finish;
        speechSynthesis.speak(utter);
      }

      setTimeout(function () {
        if (seq !== speakSeq) return;
        next();
      }, 120);
    }

    function speak(text) {
      speakPhrases([text]);
    }

    function stopSpeak() {
      speakSeq += 1;
      if (window.speechSynthesis) speechSynthesis.cancel();
      duckBgm(false);
    }

    const bgm = {
      ctx: null,
      master: null,
      duck: null,
      playing: false,
      wantPlay: false,
      step: 0,
      nextTime: 0,
      timer: null,
      duckTimer: null
    };

    const BGM_MELODY = [523.25, 659.25, 783.99, 659.25, 587.33, 783.99, 880.00, 783.99, 659.25, 523.25, 659.25, 392.00];
    const BGM_STEP = 0.55;
    const BGM_VOLUME = 0.4;

    function ensureAudio() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return Promise.resolve(null);
      if (!bgm.ctx) {
        bgm.ctx = new AC();
        bgm.master = bgm.ctx.createGain();
        bgm.duck = bgm.ctx.createGain();
        const lp = bgm.ctx.createBiquadFilter();
        lp.type = "lowpass";
        lp.frequency.value = 3200;
        bgm.duck.gain.value = 1;
        bgm.master.gain.value = BGM_VOLUME;
        bgm.duck.connect(lp);
        lp.connect(bgm.master);
        bgm.master.connect(bgm.ctx.destination);
        try {
          const osc = bgm.ctx.createOscillator();
          const g = bgm.ctx.createGain();
          g.gain.value = 0.001;
          osc.connect(g);
          g.connect(bgm.ctx.destination);
          osc.start();
          osc.stop(bgm.ctx.currentTime + 0.04);
        } catch (err) {}
      }
      const p = bgm.ctx.state === "running" ? Promise.resolve() : bgm.ctx.resume();
      return p.then(function () { return bgm.ctx; }).catch(function () { return bgm.ctx; });
    }

    function playBell(freq, time) {
      const osc = bgm.ctx.createOscillator();
      const osc2 = bgm.ctx.createOscillator();
      const g = bgm.ctx.createGain();
      const g2 = bgm.ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, time);
      osc2.type = "triangle";
      osc2.frequency.setValueAtTime(freq * 2, time);
      g2.gain.value = 0.18;
      g.gain.setValueAtTime(0, time);
      g.gain.linearRampToValueAtTime(0.28, time + 0.02);
      g.gain.linearRampToValueAtTime(0, time + 1.05);
      osc.connect(g);
      osc2.connect(g2);
      g2.connect(g);
      g.connect(bgm.duck);
      osc.start(time);
      osc.stop(time + 1.1);
      osc2.start(time);
      osc2.stop(time + 1.1);
    }

    function playSoftTick(time) {
      const osc = bgm.ctx.createOscillator();
      const f = bgm.ctx.createBiquadFilter();
      const g = bgm.ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(1200, time);
      f.type = "bandpass";
      f.frequency.value = 1400;
      f.Q.value = 4;
      g.gain.setValueAtTime(0, time);
      g.gain.linearRampToValueAtTime(0.08, time + 0.008);
      g.gain.linearRampToValueAtTime(0, time + 0.08);
      osc.connect(f);
      f.connect(g);
      g.connect(bgm.duck);
      osc.start(time);
      osc.stop(time + 0.09);
    }

    function scheduleBgm() {
      if (!bgm.playing || !bgm.ctx || bgm.ctx.state !== "running") return;
      const now = bgm.ctx.currentTime;
      if (bgm.nextTime < now) bgm.nextTime = now;
      while (bgm.nextTime < now + 1.4) {
        playBell(BGM_MELODY[bgm.step % BGM_MELODY.length], bgm.nextTime);
        if (bgm.step % 2 === 1) playSoftTick(bgm.nextTime + BGM_STEP * 0.5);
        bgm.step += 1;
        bgm.nextTime += BGM_STEP;
      }
      bgm.timer = setTimeout(scheduleBgm, 250);
    }

    function startBgm() {
      bgm.wantPlay = true;
      ensureAudio().then(function (ctx) {
        if (!ctx || !bgm.wantPlay) return;
        const now = ctx.currentTime;
        bgm.master.gain.cancelScheduledValues(now);
        bgm.master.gain.setValueAtTime(BGM_VOLUME, now);
        bgm.duck.gain.setValueAtTime(1, now);
        if (bgm.playing) return;
        bgm.playing = true;
        bgm.step = 0;
        bgm.nextTime = now + 0.05;
        scheduleBgm();
      });
    }

    function stopBgm() {
      bgm.wantPlay = false;
      bgm.playing = false;
      if (bgm.timer) {
        clearTimeout(bgm.timer);
        bgm.timer = null;
      }
      if (!bgm.ctx || !bgm.master) return;
      const now = bgm.ctx.currentTime;
      bgm.master.gain.cancelScheduledValues(now);
      bgm.master.gain.setValueAtTime(Math.max(bgm.master.gain.value, 0), now);
      bgm.master.gain.linearRampToValueAtTime(0, now + 0.35);
    }

    function duckBgm(on) {
      if (!bgm.duck || !bgm.ctx || !bgm.playing) return;
      const now = bgm.ctx.currentTime;
      bgm.duck.gain.cancelScheduledValues(now);
      bgm.duck.gain.setValueAtTime(Math.max(bgm.duck.gain.value, 0), now);
      bgm.duck.gain.linearRampToValueAtTime(on ? 0.22 : 1, now + 0.18);
      if (bgm.duckTimer) {
        clearTimeout(bgm.duckTimer);
        bgm.duckTimer = null;
      }
      if (on) {
        bgm.duckTimer = setTimeout(function () {
          duckBgm(false);
        }, 8000);
      }
    }

    function minuteNumber(minute) {
      const n = minute / 5;
      return n === 0 ? 12 : n;
    }

    function makeDailyPlan() {
      const levels = ["easy", "easy", "easy", "medium", "medium", "medium", "hard", "hard", "hard", "hard"];
      const plan = [];
      let last = null;
      let streak = 0;
      for (let i = 0; i < 10; i++) {
        let mode = Math.random() < 0.5 ? "game" : "quiz";
        if (streak >= 2 && mode === last) {
          mode = last === "game" ? "quiz" : "game";
        }
        if (mode === last) streak += 1;
        else {
          last = mode;
          streak = 1;
        }
        plan.push({ mode: mode, level: levels[i] });
      }
      return plan;
    }

    function hintTexts() {
      const hour = displayHour(state.targetHour);
      const num = minuteNumber(state.targetMinute);
      if (state.targetMinute === 0) {
        if (state.mode === "quiz") {
          return ["みじかい針を みてみよう", "みじかい針は " + hour + " の あたりだよ"];
        }
        return ["みじかい針を うごかしてね", "みじかい針を " + hour + " のところへ"];
      }
      if (state.mode === "quiz") {
        return ["まず ながい針を みてみよう", "ながい針は " + num + " を さしているよ"];
      }
      return ["まず ながい針を うごかしてね", "ながい針を " + num + " のところへ"];
    }

    function showHint(stage) {
      const texts = hintTexts();
      const text = texts[stage - 1];
      if (!text) return;
      els.hint.textContent = text;
      speak(text);
      els.hintBtn.disabled = stage >= 2;
    }

    function requestHint() {
      if (state.hintStage >= 2) return;
      state.hintStage += 1;
      showHint(state.hintStage);
    }

    function updateProgress() {
      const daily = state.session === "daily";
      els.progress.classList.toggle("show", daily);
      if (daily) {
        els.progress.textContent = (state.dailyIndex + 1) + " / 10";
      }
    }

    function goHome() {
      stopSpeak();
      stopBgm();
      state.session = "free";
      state.overlayKind = "celebrate";
      state.level = state.practiceLevel;
      setLevel(state.practiceLevel);
      els.overlay.classList.remove("show");
      els.play.classList.remove("compact");
      showScreen("home");
    }

    function allowedMinutes() {
      return LEVELS[state.level].minutes;
    }

    function randomItem(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function randomTime(avoid) {
      let hour;
      let minute;
      do {
        hour = Math.floor(Math.random() * 12);
        minute = randomItem(allowedMinutes());
      } while (avoid && hour === avoid.hour && minute === avoid.minute);
      return { hour, minute };
    }

    function nearestAllowedMinute(raw, allowed) {
      let best = allowed[0];
      let bestDist = Infinity;
      for (const m of allowed) {
        let d = Math.abs(raw - m);
        d = Math.min(d, 60 - d);
        if (d < bestDist) {
          bestDist = d;
          best = m;
        }
      }
      return best;
    }

    function snapHourFromDeg(deg) {
      const hourDeg = deg - state.minute * 0.5;
      let hour = Math.round(hourDeg / 30);
      hour = ((hour % 12) + 12) % 12;
      return hour;
    }

    const HOUR_TIP_R = 88;
    const MINUTE_TIP_R = 150;
    const KNOB_GRAB_R = 32;

    function pointerAngle(event) {
      const rect = els.clock.getBoundingClientRect();
      const x = event.clientX - (rect.left + rect.width / 2);
      const y = event.clientY - (rect.top + rect.height / 2);
      let deg = Math.atan2(x, -y) * 180 / Math.PI;
      if (deg < 0) deg += 360;
      return deg;
    }

    function eventToClockPoint(event) {
      const rect = els.clock.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) / rect.width * 400,
        y: (event.clientY - rect.top) / rect.height * 400
      };
    }

    function handTip(kind) {
      const rad = kind === "hour"
        ? ((state.hour % 12) * 30 + state.minute * 0.5) * Math.PI / 180
        : (state.minute * 6) * Math.PI / 180;
      const r = kind === "hour" ? HOUR_TIP_R : MINUTE_TIP_R;
      return {
        x: 200 + r * Math.sin(rad),
        y: 200 - r * Math.cos(rad)
      };
    }

    function pickHand(event) {
      const p = eventToClockPoint(event);
      const hourTip = handTip("hour");
      const minuteTip = handTip("minute");
      const dHour = Math.hypot(p.x - hourTip.x, p.y - hourTip.y);
      const dMinute = Math.hypot(p.x - minuteTip.x, p.y - minuteTip.y);
      if (dHour <= KNOB_GRAB_R && dMinute <= KNOB_GRAB_R) {
        return dHour <= dMinute ? "hour" : "minute";
      }
      if (dHour <= KNOB_GRAB_R) return "hour";
      if (dMinute <= KNOB_GRAB_R) return "minute";

      const dist = Math.hypot(p.x - 200, p.y - 200);
      const hourAng = (state.hour % 12) * 30 + state.minute * 0.5;
      const minuteAng = state.minute * 6;
      let overlap = Math.abs(hourAng - minuteAng);
      overlap = Math.min(overlap, 360 - overlap);
      if (overlap < 12 && dist >= 28 && dist <= 185) {
        return dist >= 118 ? "minute" : "hour";
      }

      const target = event.target.closest("#hour-arm, #minute-arm");
      if (!target) return null;
      return target.id === "hour-arm" ? "hour" : "minute";
    }

    function applyHands() {
      const minuteAngle = state.minute * 6;
      const hourAngle = (state.hour % 12) * 30 + state.minute * 0.5;
      els.hourArm.setAttribute("transform", "rotate(" + hourAngle + " 200 200)");
      els.minuteArm.setAttribute("transform", "rotate(" + minuteAngle + " 200 200)");
    }

    function buildClockFace() {
      const ticks = document.getElementById("ticks");
      const numbers = document.getElementById("numbers");
      ticks.innerHTML = "";
      numbers.innerHTML = "";
      for (let i = 0; i < 60; i++) {
        const rad = (i * 6) * Math.PI / 180;
        const inner = i % 5 === 0 ? 156 : 168;
        const outer = 178;
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", 200 + inner * Math.sin(rad));
        line.setAttribute("y1", 200 - inner * Math.cos(rad));
        line.setAttribute("x2", 200 + outer * Math.sin(rad));
        line.setAttribute("y2", 200 - outer * Math.cos(rad));
        line.setAttribute("stroke", i % 5 === 0 ? "#e85a9b" : "#f3c0d8");
        line.setAttribute("stroke-width", i % 5 === 0 ? 4 : 2);
        line.setAttribute("stroke-linecap", "round");
        ticks.appendChild(line);
      }
      for (let n = 1; n <= 12; n++) {
        const rad = (n * 30) * Math.PI / 180;
        const r = 128;
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", 200 + r * Math.sin(rad));
        text.setAttribute("y", 200 - r * Math.cos(rad) + 12);
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("font-size", "32");
        text.setAttribute("font-weight", "800");
        text.setAttribute("fill", "#5b3a55");
        text.setAttribute("font-family", "Hiragino Maru Gothic ProN, Yu Gothic, sans-serif");
        text.textContent = String(n);
        numbers.appendChild(text);
      }
    }

    function showScreen(name) {
      els.home.classList.toggle("active", name === "home");
      els.play.classList.toggle("active", name === "play");
    }

    function setLevel(level) {
      state.practiceLevel = level;
      state.level = level;
      document.querySelectorAll(".level-btn").forEach(function (btn) {
        btn.classList.toggle("active", btn.dataset.level === level);
      });
    }

    function buildQuizChoices() {
      els.hourGrid.innerHTML = "";
      for (let n = 1; n <= 12; n++) {
        const btn = document.createElement("button");
        btn.className = "pick";
        btn.textContent = n;
        btn.addEventListener("click", function () {
          state.quizHour = n === 12 ? 0 : n;
          els.hourGrid.querySelectorAll(".pick").forEach(function (el) {
            el.classList.toggle("selected", el === btn);
          });
          updateCheckEnabled();
        });
        els.hourGrid.appendChild(btn);
      }

      const mins = allowedMinutes();
      els.minGrid.innerHTML = "";
      els.minGrid.classList.toggle("many", mins.length > 4);
      mins.forEach(function (m) {
        const btn = document.createElement("button");
        btn.className = "pick";
        btn.textContent = MIN_LABELS[m];
        btn.addEventListener("click", function () {
          state.quizMinute = m;
          els.minGrid.querySelectorAll(".pick").forEach(function (el) {
            el.classList.toggle("selected", el === btn);
          });
          updateCheckEnabled();
        });
        els.minGrid.appendChild(btn);
      });

      if (mins.length === 1) {
        state.quizMinute = mins[0];
        const only = els.minGrid.querySelector(".pick");
        if (only) only.classList.add("selected");
        els.minLabel.style.display = "none";
        els.minGrid.style.display = "none";
      } else {
        els.minLabel.style.display = "";
        els.minGrid.style.display = "";
      }
    }

    function updateCheckEnabled() {
      if (state.mode === "game") {
        els.checkBtn.disabled = false;
        return;
      }
      const needMin = allowedMinutes().length > 1;
      els.checkBtn.disabled = state.quizHour === null || (needMin && state.quizMinute === null);
    }

    function newQuestion() {
      stopSpeak();
      if (state.session === "daily") {
        const q = state.dailyPlan[state.dailyIndex];
        state.mode = q.mode;
        state.level = q.level;
      }
      const target = randomTime({
        hour: state.targetHour,
        minute: state.targetMinute
      });
      state.targetHour = target.hour;
      state.targetMinute = target.minute;
      state.quizHour = null;
      state.quizMinute = allowedMinutes().length === 1 ? allowedMinutes()[0] : null;
      state.hintStage = 0;
      els.hint.textContent = "";
      els.hintBtn.disabled = false;
      els.overlay.classList.remove("show");
      state.overlayKind = "celebrate";
      updateProgress();

      if (state.mode === "game") {
        const start = randomTime(target);
        state.hour = start.hour;
        state.minute = start.minute;
        els.clock.classList.remove("locked");
        els.quizPanel.classList.remove("show");
        els.play.classList.remove("compact");
        els.prompt.textContent = formatTime(target.hour, target.minute) + " にしてね";
        els.checkBtn.textContent = "できた！";
      } else {
        state.hour = target.hour;
        state.minute = target.minute;
        els.clock.classList.add("locked");
        els.quizPanel.classList.add("show");
        els.play.classList.add("compact");
        els.prompt.textContent = "いま なんじ？";
        els.checkBtn.textContent = "これ！";
        buildQuizChoices();
      }

      applyHands();
      updateCheckEnabled();
    }

    function startMode(mode) {
      state.session = "free";
      state.level = state.practiceLevel;
      state.mode = mode;
      showScreen("play");
      startBgm();
      newQuestion();
    }

    function startDaily() {
      state.session = "daily";
      state.dailyPlan = makeDailyPlan();
      state.dailyIndex = 0;
      showScreen("play");
      startBgm();
      newQuestion();
    }

    function checkAnswer() {
      let correct;
      if (state.mode === "game") {
        correct = state.hour === state.targetHour && state.minute === state.targetMinute;
      } else {
        correct = state.quizHour === state.targetHour && state.quizMinute === state.targetMinute;
      }

      if (correct) {
        showCelebrate();
      } else {
        if (state.hintStage < 1) {
          state.hintStage = 1;
          showHint(1);
        } else {
          speak("もう一度、やってみよう。");
        }
        els.clockWrap.classList.remove("shake");
        void els.clockWrap.offsetWidth;
        els.clockWrap.classList.add("shake");
      }
    }

    function fillSparkles() {
      els.sparkles.innerHTML = "";
      for (let i = 0; i < 12; i++) {
        const s = document.createElement("span");
        s.className = "sparkle";
        s.style.left = (8 + Math.random() * 84) + "%";
        s.style.top = (6 + Math.random() * 50) + "%";
        s.style.animationDelay = (Math.random() * 0.8) + "s";
        s.style.background = randomItem(["#ffd36b", "#ff9ec8", "#c9b6ff", "#8ee0c8"]);
        els.sparkles.appendChild(s);
      }
    }

    function showCelebrate() {
      const praise = randomItem(PRAISE);
      els.praise.textContent = praise;
      speakPhrases([praise, formatTimeSpeech(state.targetHour, state.targetMinute)]);
      fillSparkles();
      const lastDaily = state.session === "daily" && state.dailyIndex >= 9;
      els.nextBtn.textContent = lastDaily ? "おわり" : "つぎへ";
      state.overlayKind = lastDaily ? "daily-end" : "celebrate";
      els.overlay.classList.add("show");
    }

    function showDailyDone() {
      stopSpeak();
      els.praise.textContent = "きょうは おしまい！";
      speak("きょうは おしまい！");
      fillSparkles();
      els.nextBtn.textContent = "ホームへ";
      state.overlayKind = "daily-home";
      els.overlay.classList.add("show");
    }

    function onNext() {
      if (state.overlayKind === "daily-end") {
        showDailyDone();
        return;
      }
      if (state.overlayKind === "daily-home") {
        goHome();
        return;
      }
      if (state.session === "daily") state.dailyIndex += 1;
      newQuestion();
    }

    function onPointerDown(event) {
      if (state.mode !== "game") return;
      const which = pickHand(event);
      if (!which) return;
      event.preventDefault();
      state.dragging = which;
      els.clock.setPointerCapture(event.pointerId);
      updateFromPointer(event);
    }

    function onPointerMove(event) {
      if (!state.dragging) return;
      event.preventDefault();
      updateFromPointer(event);
    }

    function onPointerUp() {
      state.dragging = null;
    }

    function updateFromPointer(event) {
      const deg = pointerAngle(event);
      const allowed = allowedMinutes();
      if (state.dragging === "minute") {
        const raw = (deg / 6) % 60;
        state.minute = nearestAllowedMinute(raw, allowed);
      } else {
        state.hour = snapHourFromDeg(deg);
      }
      applyHands();
    }

    function init() {
      document.getElementById("home-bunny").innerHTML = bunnySvg(150);
      document.getElementById("win-bunny").innerHTML = bunnySvg(120);
      buildClockFace();
      applyHands();

      document.querySelectorAll(".level-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          setLevel(btn.dataset.level);
        });
      });

      document.getElementById("btn-daily").addEventListener("click", function () {
        startBgm();
        startDaily();
      });
      document.getElementById("btn-game").addEventListener("click", function () {
        startBgm();
        startMode("game");
      });
      document.getElementById("btn-quiz").addEventListener("click", function () {
        startBgm();
        startMode("quiz");
      });
      document.getElementById("btn-home").addEventListener("click", goHome);
      els.hintBtn.addEventListener("click", requestHint);
      els.checkBtn.addEventListener("click", checkAnswer);
      els.nextBtn.addEventListener("click", onNext);

      els.clock.addEventListener("pointerdown", onPointerDown);
      els.clock.addEventListener("pointermove", onPointerMove);
      els.clock.addEventListener("pointerup", onPointerUp);
      els.clock.addEventListener("pointercancel", onPointerUp);

      loadVoices();
      if (window.speechSynthesis) {
        speechSynthesis.addEventListener("voiceschanged", loadVoices);
      }
    }

    init();
  </script>
</body>
</html>
